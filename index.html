<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d18">
  <meta name="description" content="Vexora Labs CRM secure workspace">
  <title>Vexora Labs CRM</title>
  <style>
    :root{color-scheme:dark;--bg:#080d18;--panel:#101a2b;--line:#26354c;--muted:#9aa9bd;--red:#e23b45}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:#f5f7fb;font:14px Inter,system-ui,sans-serif}
    .shell{height:100%;display:flex;flex-direction:column}.top{min-height:58px;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;background:#0d1525;border-bottom:1px solid var(--line)}
    .brand{font-weight:850;letter-spacing:.16em;color:#f16a72}.hint{color:var(--muted);font-size:12px}
    .open{color:white;text-decoration:none;background:linear-gradient(100deg,#e23b45,#b91c2c);padding:10px 14px;border-radius:9px;font-weight:700;white-space:nowrap}
    iframe{display:block;flex:1;width:100%;height:calc(100% - 58px);border:0;background:var(--bg)}
    .fallback{padding:18px;color:var(--muted);text-align:center}
    @media(max-width:600px){.top{padding:9px 12px}.hint{display:none}.open{padding:9px 11px;font-size:12px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div><div class="brand">VEXORA LABS <span style="color:#f5f7fb">/ CRM</span></div><div class="hint">Secure business workspace</div></div>
      <a class="open" href="https://script.google.com/macros/s/AKfycbwDQdAIAfsgOmfPLG20MhfuJrUT6c3AO2mTeSOYhmKDv_QpvopY91JFvDEXfg4cS4m42Q/exec" target="_blank" rel="noopener">Open in new tab ↗</a>
    </header>
    <iframe
      title="Vexora Labs CRM Workspace"
      src="https://script.google.com/macros/s/AKfycbwDQdAIAfsgOmfPLG20MhfuJrUT6c3AO2mTeSOYhmKDv_QpvopY91JFvDEXfg4cS4m42Q/exec"
      allow="clipboard-read; clipboard-write; fullscreen"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
    <noscript><p class="fallback">JavaScript is required to use Vexora Labs CRM.</p></noscript>
  </main>
</body>
</html>
