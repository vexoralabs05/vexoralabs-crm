<script>
const DB_KEY="vexora_pro_os_v1";
const $=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat("en-LK",{style:"currency",currency:state.settings.currency||"LKR",maximumFractionDigits:0}).format(Number(n)||0).replace("LKR","Rs.");
const uid=p=>(p||"ID")+"-"+Date.now().toString(36).toUpperCase()+"-"+Math.random().toString(36).slice(2,5).toUpperCase();
const today=()=>new Date().toISOString().slice(0,10);
const monthNow=()=>today().slice(0,7);
const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dateFmt=s=>s?new Date(s+"T00:00:00").toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}):"—";
const seed=()=>({settings:{businessName:"VEXORA LABS",currency:"LKR",businessEmail:"",businessPhone:"",appsScriptUrl:""},customers:[],subscriptions:[],products:[
{id:"p-vpn-100",name:"VPN 100GB",sku:"VPN-100",division:"VPN",category:"VPN Package",price:160,cost:0,stock:0,trackStock:false,active:true,description:"100GB VPN subscription"},
{id:"p-vpn-150",name:"VPN 150GB",sku:"VPN-150",division:"VPN",category:"VPN Package",price:200,cost:0,stock:0,trackStock:false,active:true,description:"150GB VPN subscription"},
{id:"p-vpn-200",name:"VPN 200GB",sku:"VPN-200",division:"VPN",category:"VPN Package",price:260,cost:0,stock:0,trackStock:false,active:true,description:"200GB VPN subscription"},
{id:"p-vpn-250",name:"VPN 250GB",sku:"VPN-250",division:"VPN",category:"VPN Package",price:300,cost:0,stock:0,trackStock:false,active:true,description:"250GB VPN subscription"},
{id:"p-vpn-300",name:"VPN 300GB",sku:"VPN-300",division:"VPN",category:"VPN Package",price:360,cost:0,stock:0,trackStock:false,active:true,description:"300GB VPN subscription"},
{id:"p-vpn-400",name:"VPN 400GB",sku:"VPN-400",division:"VPN",category:"VPN Package",price:400,cost:0,stock:0,trackStock:false,active:true,description:"400GB VPN subscription"},
{id:"p-vpn-500",name:"VPN 500GB",sku:"VPN-500",division:"VPN",category:"VPN Package",price:500,cost:0,stock:0,trackStock:false,active:true,description:"500GB VPN subscription"},
{id:"p-vpn-unl",name:"VPN Unlimited",sku:"VPN-UNL",division:"VPN",category:"VPN Package",price:700,cost:0,stock:0,trackStock:false,active:true,description:"Unlimited VPN subscription"},
{id:"p-lkip",name:"Sri Lankan IP Add-on",sku:"VPN-LKIP",division:"VPN",category:"Add-on",price:150,cost:0,stock:0,trackStock:false,active:true,description:"Optional Sri Lankan IP add-on"},
{id:"p-canva",name:"Canva Access",sku:"DIG-CANVA",division:"DIGITAL",category:"Digital Service",price:300,cost:0,stock:0,trackStock:false,active:true,description:"Canva digital access"}
],sales:[],expenses:[],activity:[]});
let state=loadState(),cart=[];
function loadState(){try{const d=JSON.parse(localStorage.getItem(DB_KEY));return d&&d.customers?{...seed(),...d,settings:{...seed().settings,...d.settings}}:seed()}catch(e){return seed()}}
function save(){renderAll();if(window.VEXORA_AUTH?.token){google.script.run.withFailureHandler(e=>{if(String(e.message||e).includes("SYNC_CONFLICT"))pullCloud(false);else toast("Cloud save failed: "+(e.message||e))}).withSuccessHandler(r=>{window.VEXORA_REV=r.revision;setSyncStatus("Synced")}).apiSaveState(window.VEXORA_AUTH.token,state,window.VEXORA_REV||"0")}else{localStorage.setItem(DB_KEY,JSON.stringify(state))}}
function log(action,module,detail){state.activity.unshift({id:uid("LOG"),at:new Date().toISOString(),action,module,detail});state.activity=state.activity.slice(0,500)}
function toast(msg){const el=$("toast");el.textContent=msg;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2400)}
function emptyRow(cols,msg="No records yet. Add your first record to get started."){return '<tr><td colspan="'+cols+'" class="empty">'+safe(msg)+'</td></tr>'}
function pill(status){const s=String(status||"").toUpperCase(),cl=["PAID","ACTIVE","COMPLETED"].includes(s)?"":(["PARTIAL","PENDING","DUE","EXPIRING"].includes(s)?"warning":(["UNPAID","EXPIRED","CANCELLED"].includes(s)?"danger":"neutral"));return '<span class="status-pill '+cl+'">'+safe(s)+'</span>'}
function setPage(page){document.querySelectorAll(".page").forEach(p=>p.classList.toggle("active",p.id==="page-"+page));document.querySelectorAll(".nav-link").forEach(b=>b.classList.toggle("active",b.dataset.page===page));$("pageCrumb").textContent=({dashboard:"Dashboard",analytics:"Analytics & Reports",customers:"Customers",subscriptions:"VPN & Subscriptions",sales:"Sales & Invoices",products:"Products & Services",expenses:"Expenses",finance:"Finance",activity:"Activity Log",settings:"Settings & Backup"})[page]||page;$("sidebar").classList.remove("open");renderAll()}
function sum(a,fn){return a.reduce((n,x)=>n+(fn?Number(fn(x)||0):Number(x)||0),0)}
function salesStats(){const total=sum(state.sales,s=>s.total),paid=sum(state.sales,s=>s.paid),expenses=sum(state.expenses,e=>e.amount);return{total,paid,expenses,balance:total-paid,net:paid-expenses}}
function inPeriod(date,period){if(period==="all")return true;if(period==="year")return String(date||"").startsWith(today().slice(0,4));return String(date||"").slice(0,7)===monthNow()}
function monthlyData(){const arr=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const m=d.toISOString().slice(0,7);arr.push({m,label:d.toLocaleDateString("en",{month:"short"}),sales:sum(state.sales.filter(s=>s.date?.slice(0,7)===m),s=>s.total),paid:sum(state.sales.filter(s=>s.date?.slice(0,7)===m),s=>s.paid),expenses:sum(state.expenses.filter(e=>e.date?.slice(0,7)===m),e=>e.amount)})}return arr}
function drawChart(id,data,keys=["sales","expenses"]){const el=$(id);if(!el)return;const max=Math.max(1,...data.flatMap(d=>keys.map(k=>d[k]||0)));el.innerHTML=data.map(d=>'<div class="chart-month"><div class="bar-pair">'+keys.map(k=>'<div class="bar '+(k==="expenses"?"expense":"")+'" title="'+k+': '+money(d[k])+'" style="height:'+Math.max(2,(d[k]/max)*100)+'%"></div>').join("")+'</div><small>'+safe(d.label)+'</small></div>').join("")}
function divisionTotals(){const out={VPN:0,DIGITAL:0,CLOTHING:0,OTHER:0};state.sales.forEach(s=>s.items.forEach(i=>out[i.division||"OTHER"]=(out[i.division||"OTHER"]||0)+Number(i.price)*Number(i.qty)));return out}
function renderDashboard(){const period=$("dashboardPeriod")?.value||"month",sales=state.sales.filter(s=>inPeriod(s.date,period)),expenses=state.expenses.filter(e=>inPeriod(e.date,period));const total=sum(sales,s=>s.total),paid=sum(sales,s=>s.paid),cost=sum(expenses,e=>e.amount);$("statRevenue").textContent=money(total);$("statCollected").textContent=money(paid);$("statExpenses").textContent=money(cost);$("statNet").textContent=money(paid-cost);drawChart("revenueChart",monthlyData());const div=divisionTotals(),all=sum(Object.values(div));$("portfolioChart").innerHTML=Object.entries(div).map(([k,v])=>'<div class="portfolio-item"><span>'+k+'</span><div><div class="progress"><i style="width:'+(all?v/all*100:0)+'%"></i></div></div><strong>'+money(v)+'</strong></div>').join("");$("recentSales").innerHTML=state.sales.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,5).map(s=>'<tr><td><strong>'+safe(s.invoice)+'</strong></td><td>'+safe(customerName(s.customerId))+'</td><td>'+dateFmt(s.date)+'</td><td>'+money(s.total)+'</td><td>'+pill(s.status)+'</td></tr>').join("")||emptyRow(5);const active=state.subscriptions.filter(s=>subStatus(s)==="ACTIVE").length,soon=state.subscriptions.filter(s=>daysTo(s.expiry)<=14&&daysTo(s.expiry)>=0).length,expired=state.subscriptions.filter(s=>subStatus(s)==="EXPIRED").length;$("opsList").innerHTML=[["Customers",state.customers.length],["Active VPN subscriptions",active],["Expiring in 14 days",soon],["Outstanding invoices",state.sales.filter(s=>s.total>s.paid).length]].map(([k,v])=>'<div class="ops-item"><span>'+k+'</span><b>'+v+'</b></div>').join("");const exp=state.subscriptions.filter(s=>daysTo(s.expiry)>=0&&daysTo(s.expiry)<=14).sort((a,b)=>a.expiry.localeCompare(b.expiry)).slice(0,5);$("expiryPreview").innerHTML=exp.map(s=>'<div class="expiry-item"><div><b>'+safe(customerName(s.customerId))+'</b><small>'+safe(s.orderId||s.plan)+'</small></div><span class="status-pill warning">'+daysTo(s.expiry)+' days</span></div>').join("")||'<div class="empty">No upcoming expiries. The subscriptions are behaving. Suspiciously well.</div>'}
function customerName(id){return state.customers.find(c=>c.id===id)?.name||"Walk-in customer"}
function daysTo(d){if(!d)return 9999;return Math.ceil((new Date(d+"T23:59:59")-new Date())/86400000)}
function subStatus(s){if(s.status==="CANCELLED"||s.status==="PAUSED")return s.status;if(daysTo(s.expiry)<0)return"EXPIRED";return s.status||"ACTIVE"}
function renderCustomers(){const q=($("customerSearch")?.value||"").toLowerCase(),f=$("customerFilter")?.value||"";const rows=state.customers.filter(c=>(!f||c.type===f)&&[c.name,c.phone,c.email,c.id,c.company].join(" ").toLowerCase().includes(q));$("customerCount").textContent=rows.length+" / "+state.customers.length+" customers";$("navCustomers").textContent=state.customers.length;$("customerRows").innerHTML=rows.map(c=>'<tr><td><div class="customer-name"><span class="customer-avatar">'+safe(c.name.slice(0,1).toUpperCase())+'</span><div><strong>'+safe(c.name)+'</strong><small>'+safe(c.code||c.id)+'</small></div></div></td><td>'+safe(c.phone||"—")+'<small>'+safe(c.email||"")+'</small></td><td>'+pill(c.type)+'</td><td>'+safe([c.provider,c.internetPackage].filter(Boolean).join(" · ")||"—")+'</td><td>'+state.subscriptions.filter(s=>s.customerId===c.id).length+'</td><td>'+dateFmt(c.createdAt?.slice(0,10))+'</td><td><div class="row-actions"><button data-edit-customer="'+c.id+'">Edit</button><button class="danger" data-delete-customer="'+c.id+'">×</button></div></td></tr>').join("")||emptyRow(7)}
function renderSubscriptions(){const q=($("subSearch")?.value||"").toLowerCase(),f=$("subStatus")?.value||"",rows=state.subscriptions.filter(s=>(!f||subStatus(s)===f)&&[s.orderId,s.plan,s.data,s.internetPackage,customerName(s.customerId)].join(" ").toLowerCase().includes(q));const active=state.subscriptions.filter(s=>subStatus(s)==="ACTIVE"),soon=state.subscriptions.filter(s=>daysTo(s.expiry)>=0&&daysTo(s.expiry)<=14),expired=state.subscriptions.filter(s=>subStatus(s)==="EXPIRED");$("subActive").textContent=active.length;$("subSoon").textContent=soon.length;$("subExpired").textContent=expired.length;$("subValue").textContent=money(sum(state.subscriptions,s=>s.price));$("navSubs").textContent=state.subscriptions.length;$("subscriptionRows").innerHTML=rows.map(s=>'<tr><td><strong>'+safe(s.orderId||"—")+'</strong><small>'+safe(customerName(s.customerId))+'</small></td><td>'+safe(s.plan)+'</td><td>'+safe(s.data||"—")+'</td><td>'+safe(s.internetPackage||"—")+'</td><td>'+dateFmt(s.expiry)+'</td><td>'+pill(subStatus(s))+'</td><td>'+(s.usageUrl?'<a href="'+safe(s.usageUrl)+'" target="_blank" rel="noopener">Open ↗</a>':"—")+'</td><td><div class="row-actions"><button data-edit-sub="'+s.id+'">Edit</button><button class="danger" data-delete-sub="'+s.id+'">×</button></div></td></tr>').join("")||emptyRow(8)}
function renderSales(){const q=($("saleSearch")?.value||"").toLowerCase(),f=$("saleStatus")?.value||"",rows=state.sales.filter(s=>(!f||s.status===f)&&[s.invoice,customerName(s.customerId)].join(" ").toLowerCase().includes(q));$("saleCount").textContent=rows.length+" invoices";$("salesRows").innerHTML=rows.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(s=>'<tr><td><strong>'+safe(s.invoice)+'</strong></td><td>'+safe(customerName(s.customerId))+'</td><td>'+dateFmt(s.date)+'</td><td>'+s.items.length+'</td><td>'+money(s.total)+'</td><td>'+money(s.paid)+'</td><td>'+money(s.total-s.paid)+'</td><td>'+pill(s.status)+'</td><td><div class="row-actions"><button data-view-sale="'+s.id+'">View</button><button data-pay-sale="'+s.id+'">Payment</button></div></td></tr>').join("")||emptyRow(9)}
function renderProducts(){const q=($("productSearch")?.value||"").toLowerCase(),f=$("productDivision")?.value||"";const rows=state.products.filter(p=>p.active!==false&&(!f||p.division===f)&&[p.name,p.sku,p.category].join(" ").toLowerCase().includes(q));$("productGrid").innerHTML=rows.map(p=>'<article class="product-card"><div class="product-top"><span class="product-symbol">'+({VPN:"◉",DIGITAL:"✦",CLOTHING:"◇",OTHER:"▦"}[p.division]||"▦")+'</span>'+pill(p.division)+'</div><h3>'+safe(p.name)+'</h3><p>'+safe(p.description||p.category||"Business product or service")+'</p><strong>'+money(p.price)+'</strong><small> · '+safe(p.sku||"No SKU")+'</small><div class="product-actions"><button data-edit-product="'+p.id+'">Edit product</button><button class="delete" data-delete-product="'+p.id+'">Archive</button></div></article>').join("")||'<div class="panel empty">No matching products.</div>'}
function renderExpenses(){const m=$("expenseMonth")?.value||monthNow(),f=$("expenseCategoryFilter")?.value||"",rows=state.expenses.filter(e=>e.date?.slice(0,7)===m&&(!f||e.category===f));$("expenseTotal").textContent=money(sum(rows,e=>e.amount));$("expenseRows").innerHTML=rows.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(e=>'<tr><td>'+dateFmt(e.date)+'</td><td>'+pill(e.category)+'</td><td><strong>'+safe(e.description)+'</strong><small>'+safe(e.vendor||"")+'</small></td><td>'+safe(e.division||"—")+'</td><td>'+safe(e.method||"—")+'</td><td>'+money(e.amount)+'</td><td><div class="row-actions"><button data-delete-expense="'+e.id+'" class="danger">Delete</button></div></td></tr>').join("")||emptyRow(7,"No expenses recorded for this month.")}
function renderFinance(){const x=salesStats();$("finSales").textContent=money(x.total);$("finCollected").textContent=money(x.paid);$("finOutstanding").textContent=money(x.balance);$("finExpenses").textContent=money(x.expenses);drawChart("cashflowChart",monthlyData(),["paid","expenses"]);const div={};state.sales.forEach(s=>s.items.forEach(i=>div[i.division||"OTHER"]=(div[i.division||"OTHER"]||0)+i.price*i.qty));const max=Math.max(1,...Object.values(div));$("divisionFinance").innerHTML=Object.entries(div).map(([k,v])=>'<div class="portfolio-item"><span>'+safe(k)+'</span><div><div class="progress"><i style="width:'+(v/max*100)+'%"></i></div></div><strong>'+money(v)+'</strong></div>').join("")||'<div class="empty">No sales yet.</div>';$("receivableRows").innerHTML=state.sales.filter(s=>s.total>s.paid).map(s=>'<tr><td>'+safe(s.invoice)+'</td><td>'+safe(customerName(s.customerId))+'</td><td>'+dateFmt(s.dueDate)+'</td><td>'+money(s.total)+'</td><td>'+money(s.paid)+'</td><td>'+money(s.total-s.paid)+'</td></tr>').join("")||emptyRow(6,"No outstanding invoices.")}
function renderAnalytics(){const buyers=new Set(state.sales.map(s=>s.customerId).filter(Boolean));$("reportCustomers").textContent=state.customers.length;$("reportBuyers").textContent=buyers.size;$("reportAverage").textContent=money(state.sales.length?sum(state.sales,s=>s.total)/state.sales.length:0);$("reportRenewals").textContent=state.subscriptions.filter(s=>daysTo(s.expiry)>=0&&daysTo(s.expiry)<=30).length;drawChart("analyticsChart",monthlyData(),["sales","paid","expenses"]);const types={INDIVIDUAL:0,BUSINESS:0,RESELLER:0};state.customers.forEach(c=>types[c.type]=(types[c.type]||0)+1);const max=Math.max(1,...Object.values(types));$("customerMix").innerHTML=Object.entries(types).map(([k,v])=>'<div class="portfolio-item"><span>'+k+'</span><div><div class="progress"><i style="width:'+(v/max*100)+'%"></i></div></div><strong>'+v+'</strong></div>').join("")}
function renderActivity(){$("activityRows").innerHTML=state.activity.map(a=>'<tr><td>'+new Date(a.at).toLocaleString()+'</td><td>'+pill(a.action)+'</td><td>'+safe(a.module)+'</td><td>'+safe(a.detail)+'</td></tr>').join("")||emptyRow(4,"No activity recorded yet.")}
function renderSettings(){$("businessName").value=state.settings.businessName||"";$("currency").value=state.settings.currency||"LKR";$("businessEmail").value=state.settings.businessEmail||"";$("businessPhone").value=state.settings.businessPhone||"";$("appsScriptUrl").value=state.settings.appsScriptUrl||"";$("dataDiagnostics").innerHTML=[["Customers",state.customers.length],["Subscriptions",state.subscriptions.length],["Products",state.products.length],["Invoices",state.sales.length],["Expenses",state.expenses.length],["Activity events",state.activity.length]].map(([k,v])=>'<span>'+k+': <b>'+v+'</b></span>').join("")}
function renderAll(){renderDashboard();renderCustomers();renderSubscriptions();renderSales();renderProducts();renderExpenses();renderFinance();renderAnalytics();renderActivity();renderSettings()}
function openModal(title,eyebrow,html,onSubmit){$("modalTitle").textContent=title;$("modalEyebrow").textContent=eyebrow;$("modalBody").innerHTML=html;$("modalBackdrop").classList.add("open");$("modalBody").querySelector("form")?.addEventListener("submit",e=>{e.preventDefault();const fd=new FormData(e.target);onSubmit(Object.fromEntries(fd.entries()),e.target)})}
function closeModal(){$("modalBackdrop").classList.remove("open")}
const actions='<div class="form-submit"><button type="button" class="btn btn-ghost" id="cancelModal">Cancel</button><button class="btn btn-primary" type="submit">Save record</button></div>';
function wireCancel(){$("cancelModal")?.addEventListener("click",closeModal)}
function customerModal(id){const c=state.customers.find(x=>x.id===id)||{};openModal(id?"Edit customer":"Add customer","CUSTOMER PROFILE",'<form class="modal-form"><label>Full name *<input name="name" required value="'+safe(c.name||"")+'"></label><label>Customer type<select name="type"><option '+(c.type==="INDIVIDUAL"?"selected":"")+'>INDIVIDUAL</option><option '+(c.type==="BUSINESS"?"selected":"")+'>BUSINESS</option><option '+(c.type==="RESELLER"?"selected":"")+'>RESELLER</option></select></label><label>Phone / WhatsApp<input name="phone" value="'+safe(c.phone||"")+'"></label><label>Email<input type="email" name="email" value="'+safe(c.email||"")+'"></label><label>Company<input name="company" value="'+safe(c.company||"")+'"></label><label>Internet provider<input name="provider" value="'+safe(c.provider||"")+'" placeholder="Hutch / Dialog / SLT"></label><label>Internet package<input name="internetPackage" value="'+safe(c.internetPackage||"")+'"></label><label>Telegram<input name="telegram" value="'+safe(c.telegram||"")+'"></label><label class="full">Address<textarea name="address" rows="2">'+safe(c.address||"")+'</textarea></label><label class="full">Notes<textarea name="notes" rows="2">'+safe(c.notes||"")+'</textarea></label>'+actions+'</form>',d=>{const now=new Date().toISOString();const obj={...c,...d,id:id||uid("CUS"),code:c.code||"CUS-"+Math.random().toString(36).slice(2,8).toUpperCase(),createdAt:c.createdAt||now,updatedAt:now};if(id)state.customers=state.customers.map(x=>x.id===id?obj:x);else state.customers.unshift(obj);log(id?"UPDATED":"CREATED","Customer",obj.name);save();closeModal();toast("Customer saved")});wireCancel()}
function subscriptionModal(id,defaults={}){const s=state.subscriptions.find(x=>x.id===id)||defaults;const opts=state.customers.map(c=>'<option value="'+c.id+'" '+(s.customerId===c.id?"selected":"")+'>'+safe(c.name)+' · '+safe(c.phone||"")+'</option>').join("");openModal(id?"Edit subscription":"Add subscription","VPN MANAGEMENT",'<form class="modal-form"><label>Customer *<select name="customerId" required><option value="">Select customer</option>'+opts+'</select></label><label>Order ID<input name="orderId" value="'+safe(s.orderId||"")+'" placeholder="U7EDAD"></label><label>VPN plan *<input name="plan" required value="'+safe(s.plan||"")+'" placeholder="VPN 100GB"></label><label>Data allowance<input name="data" value="'+safe(s.data||"")+'" placeholder="100 GB"></label><label>Internet package<input name="internetPackage" value="'+safe(s.internetPackage||"")+'"></label><label>Start date<input name="start" type="date" value="'+safe(s.start||today())+'"></label><label>Expiry date *<input name="expiry" type="date" required value="'+safe(s.expiry||"")+'"></label><label>Price (LKR)<input name="price" type="number" min="0" value="'+safe(s.price??0)+'"></label><label>Status<select name="status">'+["ACTIVE","PAUSED","CANCELLED","EXPIRED"].map(x=>'<option '+((s.status||"ACTIVE")===x?"selected":"")+'>'+x+'</option>').join("")+'</select></label><label class="full">Usage link<input name="usageUrl" type="url" value="'+safe(s.usageUrl||"")+'" placeholder="https://..."></label><label class="full">Notes<textarea name="notes" rows="2">'+safe(s.notes||"")+'</textarea></label>'+actions+'</form>',d=>{if(state.subscriptions.some(x=>x.orderId&&x.orderId===d.orderId&&x.id!==id))return toast("That Order ID already exists");const obj={...s,...d,price:Number(d.price)||0,id:id||uid("VPN"),createdAt:s.createdAt||new Date().toISOString()};if(id)state.subscriptions=state.subscriptions.map(x=>x.id===id?obj:x);else state.subscriptions.unshift(obj);log(id?"UPDATED":"CREATED","Subscription",(obj.orderId||obj.plan)+" · "+customerName(obj.customerId));save();closeModal();toast("Subscription saved")});wireCancel()}
function productModal(id){const p=state.products.find(x=>x.id===id)||{};openModal(id?"Edit product":"Add product","PRODUCT CATALOGUE",'<form class="modal-form"><label>Product / service name *<input name="name" required value="'+safe(p.name||"")+'"></label><label>SKU<input name="sku" value="'+safe(p.sku||"")+'"></label><label>Division<select name="division">'+["VPN","DIGITAL","CLOTHING","OTHER"].map(x=>'<option '+((p.division||"VPN")===x?"selected":"")+'>'+x+'</option>').join("")+'</select></label><label>Category<input name="category" value="'+safe(p.category||"")+'"></label><label>Sale price *<input name="price" type="number" min="0" required value="'+safe(p.price??0)+'"></label><label>Unit cost<input name="cost" type="number" min="0" value="'+safe(p.cost??0)+'"></label><label>Track stock<select name="trackStock"><option value="false">No (service / digital)</option><option value="true" '+(p.trackStock?"selected":"")+'>Yes (physical product)</option></select></label><label>Stock quantity<input name="stock" type="number" min="0" value="'+safe(p.stock??0)+'"></label><label class="full">Description<textarea name="description" rows="2">'+safe(p.description||"")+'</textarea></label>'+actions+'</form>',d=>{const obj={...p,...d,id:id||uid("PRD"),price:Number(d.price),cost:Number(d.cost),stock:Number(d.stock),trackStock:d.trackStock==="true",active:true};if(id)state.products=state.products.map(x=>x.id===id?obj:x);else state.products.unshift(obj);log(id?"UPDATED":"CREATED","Product",obj.name);save();closeModal();toast("Product saved")});wireCancel()}
function expenseModal(){openModal("Record expense","FINANCE",'<form class="modal-form"><label>Date *<input type="date" name="date" required value="'+today()+'"></label><label>Category<select name="category">'+["SERVER","SOFTWARE","MARKETING","OPERATIONS","DELIVERY","OTHER"].map(x=>'<option>'+x+'</option>').join("")+'</select></label><label>Amount (LKR) *<input type="number" name="amount" min="0.01" step=".01" required></label><label>Division<select name="division">'+["VPN","DIGITAL","CLOTHING","OTHER"].map(x=>'<option>'+x+'</option>').join("")+'</select></label><label>Vendor / paid to<input name="vendor"></label><label>Payment method<select name="method">'+["CASH","BANK TRANSFER","CARD","ONLINE","OTHER"].map(x=>'<option>'+x+'</option>').join("")+'</select></label><label class="full">Description *<textarea name="description" required rows="2"></textarea></label>'+actions+'</form>',d=>{state.expenses.unshift({...d,id:uid("EXP"),amount:Number(d.amount),createdAt:new Date().toISOString()});log("RECORDED","Expense",d.category+" · "+money(d.amount));save();closeModal();toast("Expense recorded")});wireCancel()}
function saleModal(){if(!state.products.some(p=>p.active!==false))return toast("Add a product first");const customerOpts=state.customers.map(c=>'<option value="'+c.id+'">'+safe(c.name)+'</option>').join("");const productOpts=state.products.filter(p=>p.active!==false).map(p=>'<option value="'+p.id+'">'+safe(p.name)+' · '+money(p.price)+'</option>').join("");cart=[];openModal("Create new sale","POINT OF SALE",'<form id="saleForm" class="modal-form"><label class="full">Customer<select id="saleCustomer" name="customerId"><option value="">Walk-in customer</option>'+customerOpts+'</select></label><label class="full">Add product<select id="cartProduct"><option value="">Select product</option>'+productOpts+'</select></label><div class="full" id="cartRows"></div><label>Discount<input name="discount" type="number" min="0" value="0"></label><label>Payment received<input name="paid" type="number" min="0" value="0"></label><label>Payment method<select name="method">'+["CASH","BANK TRANSFER","CARD","ONLINE","OTHER"].map(x=>'<option>'+x+'</option>').join("")+'</select></label><label>Due date<input name="dueDate" type="date"></label><div class="full" id="cartTotal">Total: '+money(0)+'</div>'+actions+'</form>',d=>{if(!cart.length)return toast("Add at least one product");const subtotal=sum(cart,i=>i.price*i.qty),total=Math.max(0,subtotal-Number(d.discount||0)),paid=Math.min(total,Number(d.paid||0));const items=cart.map(i=>({...i}));const sale={id:uid("INV"),invoice:"VX-"+new Date().getFullYear()+"-"+String(Date.now()).slice(-6),customerId:d.customerId,date:today(),dueDate:d.dueDate||"",items,subtotal,discount:Number(d.discount||0),total,paid,method:d.method,status:paid>=total?"PAID":paid>0?"PARTIAL":"UNPAID",createdAt:new Date().toISOString()};state.sales.unshift(sale);items.forEach(i=>{const p=state.products.find(x=>x.id===i.productId);if(p?.trackStock)p.stock=Math.max(0,p.stock-i.qty)});log("CREATED","Invoice",sale.invoice+" · "+money(total));save();closeModal();toast("Sale created · "+sale.invoice)});wireCancel();$("cartProduct").addEventListener("change",e=>{const p=state.products.find(x=>x.id===e.target.value);if(!p)return;const existing=cart.find(x=>x.productId===p.id);if(existing)existing.qty++;else cart.push({productId:p.id,name:p.name,division:p.division,price:Number(p.price),qty:1});e.target.value="";renderCart()});$("cartRows").addEventListener("click",e=>{const id=e.target.dataset.removeCart;if(id){cart=cart.filter(x=>x.productId!==id);renderCart()}});$("saleForm").addEventListener("input",e=>{if(e.target.name==="discount")renderCart()})}
function renderCart(){const host=$("cartRows");if(!host)return;host.innerHTML=cart.map(i=>'<div class="ops-item"><span>'+safe(i.name)+' × '+i.qty+'</span><b>'+money(i.price*i.qty)+'</b><button type="button" class="text-btn" data-remove-cart="'+i.productId+'">Remove</button></div>').join("")||'<p class="muted">No products added yet.</p>';const subtotal=sum(cart,i=>i.price*i.qty),discount=Number($('saleForm')?.elements.discount?.value||0);$("cartTotal").textContent="Subtotal: "+money(subtotal)+" · Discount: "+money(discount)+" · Total: "+money(Math.max(0,subtotal-discount))}
function paymentModal(id){const s=state.sales.find(x=>x.id===id);if(!s)return;openModal("Record payment","PAYMENT COLLECTION",'<form class="modal-form"><div class="full"><b>'+safe(s.invoice)+'</b><p class="muted">Balance due: '+money(s.total-s.paid)+'</p></div><label>Payment amount *<input type="number" name="amount" min=".01" max="'+(s.total-s.paid)+'" step=".01" required></label><label>Payment method<select name="method">'+["CASH","BANK TRANSFER","CARD","ONLINE","OTHER"].map(x=>'<option>'+x+'</option>').join("")+'</select></label>'+actions+'</form>',d=>{const amount=Number(d.amount);if(amount<=0||amount>s.total-s.paid)return toast("Invalid payment amount");s.paid+=amount;s.status=s.paid>=s.total?"PAID":"PARTIAL";s.payments=s.payments||[];s.payments.push({amount,method:d.method,date:today()});log("PAYMENT","Invoice",s.invoice+" · "+money(amount));save();closeModal();toast("Payment recorded")});wireCancel()}
function viewSale(id){const s=state.sales.find(x=>x.id===id);if(!s)return;openModal("Invoice "+s.invoice,"SALES INVOICE",'<div class="invoice-view"><h3>'+safe(state.settings.businessName)+'</h3><p>'+safe(customerName(s.customerId))+' · '+dateFmt(s.date)+'</p><div class="table-wrap"><table><thead><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead><tbody>'+s.items.map(i=>'<tr><td>'+safe(i.name)+'</td><td>'+i.qty+'</td><td>'+money(i.price)+'</td><td>'+money(i.qty*i.price)+'</td></tr>').join("")+'</tbody></table></div><p>Subtotal: '+money(s.subtotal)+'</p><p>Discount: '+money(s.discount)+'</p><h3>Total: '+money(s.total)+'</h3><p>Paid: '+money(s.paid)+' · Balance: '+money(s.total-s.paid)+'</p>'+pill(s.status)+'<div class="form-actions"><button class="btn btn-primary" id="printInvoice">Print invoice</button></div></div>',()=>{});$("printInvoice").addEventListener("click",()=>{const w=window.open("","_blank");w.document.write('<html><head><title>'+safe(s.invoice)+'</title><style>body{font:14px Arial;padding:30px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}</style></head><body><h1>'+safe(state.settings.businessName)+'</h1><h2>Invoice '+safe(s.invoice)+'</h2><p>Customer: '+safe(customerName(s.customerId))+'</p><p>Date: '+dateFmt(s.date)+'</p><table><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr>'+s.items.map(i=>'<tr><td>'+safe(i.name)+'</td><td>'+i.qty+'</td><td>'+money(i.price)+'</td><td>'+money(i.price*i.qty)+'</td></tr>').join("")+'</table><h2>Total: '+money(s.total)+'</h2><p>Paid: '+money(s.paid)+' · Balance: '+money(s.total-s.paid)+'</p></body></html>');w.document.close();w.print()})}
function parseVpn(raw){const get=key=>{const m=raw.match(new RegExp("^\\s*"+key+"\\s*:\\s*(.*?)\\s*$","im"));return m?m[1].trim():""};const orderRaw=get("Order"),match=orderRaw.match(/^(.+?)\s*[—-]\s*(.+)$/);const order=match?match[1].trim():orderRaw,name=get("Customer|Name")||(match?match[2].trim():"");const data=get("Data"),pkg=get("Package|Internet package"),expiry=get("Expires"),url=get("Usage link");if(!order||!name||!data||!expiry||!url)throw Error("Required fields missing. Include Order, customer name, Data, Expires and Usage link.");const dm=data.match(/([\d.]+)\s*(GB|MB|TB)?/i);const dt=dm?dm[1]+" "+(dm[2]||"GB").toUpperCase():data;let d=new Date(expiry);if(Number.isNaN(d.getTime())){const parts=expiry.match(/^(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})$/);if(parts)d=new Date(parts[2]+" "+parts[1]+", "+parts[3])}if(Number.isNaN(d.getTime()))throw Error("Expiry date format not recognised.");if(!/^https:\/\//i.test(url))throw Error("Usage link must start with https://");return{orderId:order,name,data:dt,internetPackage:pkg,expiry:d.toISOString().slice(0,10),usageUrl:url,plan:"VPN "+dt}}
function importVpn(){try{const p=parseVpn($("vpnPaste").value);if(state.subscriptions.some(s=>s.orderId===p.orderId))throw Error("This Order ID already exists.");let c=state.customers.find(x=>x.name.toLowerCase()===p.name.toLowerCase());if(!c){c={id:uid("CUS"),code:"CUS-"+Math.random().toString(36).slice(2,8).toUpperCase(),name:p.name,type:"INDIVIDUAL",phone:"",provider:"",internetPackage:p.internetPackage,createdAt:new Date().toISOString()};state.customers.unshift(c)}const sub={...p,id:uid("VPN"),customerId:c.id,start:today(),price:0,status:"ACTIVE",createdAt:new Date().toISOString()};state.subscriptions.unshift(sub);log("IMPORTED","Subscription",p.orderId+" · "+p.name);save();$("vpnPaste").value="";$("importStatus").textContent="Imported "+p.orderId+" for "+p.name;toast("VPN subscription imported")}catch(e){$("importStatus").textContent=e.message;toast(e.message)}}
function csvDownload(name,rows){if(!rows.length)return toast("No data to export");const headers=[...new Set(rows.flatMap(o=>Object.keys(o)))];const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';const csv=[headers.map(q).join(","),...rows.map(r=>headers.map(h=>q(Array.isArray(r[h])?JSON.stringify(r[h]):r[h])).join(","))].join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function backup(){const blob=new Blob([JSON.stringify({app:"VEXORA Pro OS",version:1,exportedAt:new Date().toISOString(),data:state},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="VEXORA-Pro-OS-Backup-"+today()+".json";a.click();URL.revokeObjectURL(a.href);toast("Backup downloaded")}
function restore(file){const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);const d=x.data||x;if(!d.customers||!d.sales||!d.products)throw Error("This is not a valid VEXORA Pro OS backup");if(!confirm("Replace current workspace data with this backup?"))return;state={...seed(),...d};save();toast("Backup restored")}catch(e){toast(e.message)}};r.readAsText(file)}
function exportReport(){csvDownload("VEXORA-Sales-Report.csv",state.sales.map(s=>({invoice:s.invoice,customer:customerName(s.customerId),date:s.date,total:s.total,paid:s.paid,balance:s.total-s.paid,status:s.status})))}
function bind(){document.querySelectorAll(".nav-link").forEach(b=>b.addEventListener("click",()=>setPage(b.dataset.page)));document.querySelectorAll("[data-goto]").forEach(b=>b.addEventListener("click",()=>setPage(b.dataset.goto)));$("menuToggle").onclick=()=>$("sidebar").classList.toggle("open");$("quickAdd").onclick=()=>openQuick();$("modalClose").onclick=closeModal;$("modalBackdrop").addEventListener("click",e=>{if(e.target===$("modalBackdrop"))closeModal()});$("dashboardPeriod").onchange=renderDashboard;$("dashboardExport").onclick=exportReport;$("financeExport").onclick=()=>csvDownload("VEXORA-Finance.csv",state.sales.map(s=>({invoice:s.invoice,total:s.total,paid:s.paid,balance:s.total-s.paid})));$("analyticsExport").onclick=backup;
$("addCustomer").onclick=()=>customerModal();$("customerSearch").oninput=renderCustomers;$("customerFilter").onchange=renderCustomers;$("customerRows").onclick=e=>{const edit=e.target.dataset.editCustomer,del=e.target.dataset.deleteCustomer;if(edit)customerModal(edit);if(del&&confirm("Delete this customer? Linked sales and subscriptions will remain, but customer name will no longer resolve.")){state.customers=state.customers.filter(c=>c.id!==del);log("DELETED","Customer",del);save()}};
$("addSubscription").onclick=()=>subscriptionModal();$("subSearch").oninput=renderSubscriptions;$("subStatus").onchange=renderSubscriptions;$("subscriptionRows").onclick=e=>{const edit=e.target.dataset.editSub,del=e.target.dataset.deleteSub;if(edit)subscriptionModal(edit);if(del&&confirm("Delete this subscription?")){state.subscriptions=state.subscriptions.filter(s=>s.id!==del);log("DELETED","Subscription",del);save()}};
$("toggleImporter").onclick=()=>$("vpnImporter").hidden=!$("vpnImporter").hidden;$("runImport").onclick=importVpn;
$("newSale").onclick=saleModal;$("saleSearch").oninput=renderSales;$("saleStatus").onchange=renderSales;$("salesRows").onclick=e=>{if(e.target.dataset.viewSale)viewSale(e.target.dataset.viewSale);if(e.target.dataset.paySale)paymentModal(e.target.dataset.paySale)};
$("addProduct").onclick=()=>productModal();$("productSearch").oninput=renderProducts;$("productDivision").onchange=renderProducts;$("productGrid").onclick=e=>{const edit=e.target.dataset.editProduct,del=e.target.dataset.deleteProduct;if(edit)productModal(edit);if(del&&confirm("Archive this product? It will no longer appear in new sales.")){const p=state.products.find(x=>x.id===del);p.active=false;log("ARCHIVED","Product",p.name);save()}};
$("addExpense").onclick=expenseModal;$("expenseMonth").value=monthNow();$("expenseMonth").onchange=renderExpenses;$("expenseCategoryFilter").onchange=renderExpenses;$("expenseRows").onclick=e=>{const id=e.target.dataset.deleteExpense;if(id&&confirm("Delete this expense?")){state.expenses=state.expenses.filter(x=>x.id!==id);log("DELETED","Expense",id);save()}};
$("businessForm").onsubmit=e=>{e.preventDefault();state.settings={...state.settings,businessName:$("businessName").value,currency:$("currency").value,businessEmail:$("businessEmail").value,businessPhone:$("businessPhone").value};save();toast("Business profile saved")};$("saveCloudConfig").onclick=()=>{state.settings.appsScriptUrl=$("appsScriptUrl").value.trim();save();toast("Cloud URL saved. Sync remains disabled until authentication is configured.")};$("backupDownload").onclick=backup;$("backupFile").onchange=e=>{if(e.target.files[0])restore(e.target.files[0])};$("exportAllCsv").onclick=()=>{csvDownload("VEXORA-Customers.csv",state.customers);csvDownload("VEXORA-Subscriptions.csv",state.subscriptions);csvDownload("VEXORA-Sales.csv",state.sales);csvDownload("VEXORA-Expenses.csv",state.expenses)};$("exportCustomers").onclick=()=>csvDownload("VEXORA-Customers.csv",state.customers);$("exportSales").onclick=()=>csvDownload("VEXORA-Sales.csv",state.sales);$("exportExpenses").onclick=()=>csvDownload("VEXORA-Expenses.csv",state.expenses);$("exportSubscriptions").onclick=()=>csvDownload("VEXORA-Subscriptions.csv",state.subscriptions);$("clearActivity").onclick=()=>{if(confirm("Clear all activity log entries?")){state.activity=[];save()}};$("resetWorkspace").onclick=()=>{if(confirm("This permanently clears all VEXORA Pro OS data from this browser. Download a backup first. Continue?")){localStorage.removeItem(DB_KEY);state=seed();save();toast("Workspace reset")}}}

function init(){ $("todayLabel").textContent=new Date().toLocaleDateString("en-GB",{weekday:"short",day:"2-digit",month:"short",year:"numeric"});bind();renderAll();}
function setSyncStatus(v){const e=$("syncNow");if(e)e.title=v;}
function showWorkspace(user){window.VEXORA_USER=user;$("accountManagement").style.display=user.role==="CEO"?"block":"none";$("createAccountForm").onsubmit=async e=>{e.preventDefault();$("accountStatus").textContent="Creating account...";try{const r=await authCall("createAccount",window.VEXORA_AUTH.token,$("newUsername").value,$("newPassword").value,$("newRole").value);$("accountStatus").textContent="Created "+r.role+" account: "+r.username;$("createAccountForm").reset()}catch(err){$("accountStatus").textContent=err.message||String(err)}};$("authScreen").hidden=true;document.querySelector(".app-shell").style.display="flex";$("signedInUser").textContent=user.username;$("signedInRole").textContent=user.role;init();}
function authCall(method,...args){return new Promise((resolve,reject)=>{const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);runner[method](...args)})}
async function startAuth(){document.querySelector(".app-shell").style.display="none";$("authScreen").hidden=false;try{const status=await authCall("getAuthStatus");if(status.needsBootstrap){$("authLogin").hidden=true;$("authBootstrap").hidden=false}else{$("authLogin").hidden=false;$("authBootstrap").hidden=true}}catch(e){$("loginError").textContent=e.message||String(e)}
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginError").textContent="";try{const r=await authCall("login",$("loginUsername").value,$("loginPassword").value);window.VEXORA_AUTH={token:r.token};const d=await authCall("getWorkspace",r.token);state={...seed(),...d.data,settings:{...seed().settings,...(d.data.settings||{})}};localStorage.setItem(DB_KEY,JSON.stringify(state));window.VEXORA_REV=d.revision;showWorkspace(r.user);startLiveSync()}catch(err){$("loginError").textContent=err.message||String(err)}};
$("bootstrapForm").onsubmit=async e=>{e.preventDefault();$("setupError").textContent="";if($("setupPassword").value!==$("setupConfirm").value){$("setupError").textContent="Passwords do not match.";return}try{const r=await authCall("bootstrapOwner",$("setupUsername").value,$("setupPassword").value,$("setupKey").value);window.VEXORA_AUTH={token:r.token};state={...seed(),...r.data};showWorkspace(r.user);startLiveSync()}catch(err){$("setupError").textContent=err.message||String(err)}};
$("syncNow").onclick=()=>pullCloud(true);$("logoutBtn").onclick=async()=>{try{await authCall("logout",window.VEXORA_AUTH?.token)}catch(e){}window.VEXORA_AUTH=null;location.reload()};}
async function pullCloud(manual=false){if(!window.VEXORA_AUTH?.token)return;try{const r=await authCall("getWorkspace",window.VEXORA_AUTH.token);if(r.revision!==window.VEXORA_REV){state={...seed(),...r.data,settings:{...seed().settings,...(r.data.settings||{})}};window.VEXORA_REV=r.revision;renderAll();setSyncStatus("Cloud changes received")}else if(manual)setSyncStatus("Already up to date")}catch(e){setSyncStatus("Sync error");if(manual)toast(e.message||String(e))}}

startAuth();
